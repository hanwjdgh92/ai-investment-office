<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>나의 AI 투자 오피스</title>
<style>
  :root {
    --bg-top: #fdf3ff;
    --bg-bottom: #eef4ff;
    --panel-bg: #ffffffcc;
    --text-main: #2c2c3a;
    --text-sub: #6b6b80;
    --border: #e6e3f5;
    --accent: #7c6cf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #201c2e;
      --bg-bottom: #16141f;
      --panel-bg: #2a2638cc;
      --text-main: #ecebf5;
      --text-sub: #a5a2ba;
      --border: #3a3650;
      --accent: #a99bff;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #201c2e;
    --bg-bottom: #16141f;
    --panel-bg: #2a2638cc;
    --text-main: #ecebf5;
    --text-sub: #a5a2ba;
    --border: #3a3650;
    --accent: #a99bff;
  }
  :root[data-theme="light"] {
    --bg-top: #fdf3ff;
    --bg-bottom: #eef4ff;
    --panel-bg: #ffffffcc;
    --text-main: #2c2c3a;
    --text-sub: #6b6b80;
    --border: #e6e3f5;
    --accent: #7c6cf0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text-main);
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    padding: 24px;
  }

  .app { max-width: 1180px; margin: 0 auto; }

  header.topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 24px;
    margin-bottom: 20px;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand h1 { margin: 0; font-size: 1.4rem; }
  .brand .meta { font-size: 0.82rem; color: var(--text-sub); }

  .run-now-btn {
    border: none; border-radius: 999px; padding: 10px 18px; font-size: 0.85rem; font-weight: 600;
    background: var(--accent); color: white; cursor: pointer;
  }
  .run-now-btn:disabled { opacity: 0.6; cursor: default; }

  .layout { display: grid; grid-template-columns: 1fr 440px; gap: 20px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

  /* ---- 오피스 타일맵 (부서 구역): 3개 자산군 부서(크립토/국내주식/해외주식) + PM/TRADING/RISK ----
     모든 존은 같은 어두운 베이스를 공유하고, 부서마다 --zone-accent 색만 달라진다(상단 바/라벨/장식/은은한 글로우).
     방마다 완전히 다른 색을 칠하는 대신 "같은 오피스, 다른 팻말"처럼 보이게 하는 게 목표. */
  .office-map {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-areas:
      "crypto krstock usstock"
      "pm trading risk";
    gap: 12px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid var(--border);
    padding: 12px;
    background: #0a0912;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
  }
  @media (max-width: 640px) {
    .office-map { grid-template-columns: 1fr; grid-template-areas: "crypto" "krstock" "usstock" "pm" "trading" "risk"; }
  }

  .zone {
    position: relative;
    border-radius: 14px;
    min-height: 160px;
    padding: 38px 12px 12px;
    background-color: #161a26;
    background-image:
      radial-gradient(circle at 88% -12%, var(--zone-accent) 0%, transparent 48%),
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 22px 22px, 22px 22px;
    background-blend-mode: normal, normal, normal;
    border-top: 3px solid var(--zone-accent);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.3);
  }
  .zone[data-team="크립토"]    { grid-area: crypto;   --zone-accent: #f2a33d; }
  .zone[data-team="국내주식"]  { grid-area: krstock;  --zone-accent: #6fb3e8; }
  .zone[data-team="해외주식"]  { grid-area: usstock;  --zone-accent: #4fd0a0; }
  .zone[data-team="PM"]        { grid-area: pm;       --zone-accent: #f2d43d; }
  .zone[data-team="TRADING"]   { grid-area: trading;  --zone-accent: #4fd07a; }
  .zone[data-team="RISK MGMT"] { grid-area: risk;     --zone-accent: #e8564f; }

  .zone-label {
    position: absolute; top: 10px; left: 10px;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em;
    color: #12121a; background: var(--zone-accent);
    padding: 4px 12px; border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .zone-decor {
    position: absolute; top: 8px; right: 10px;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 4px 7px;
  }
  .decor-icon { width: 70px; height: 20px; display: block; }

  /* 전원 잠금 상태인 존(TRADING/RISK MGMT)은 텅 빈 느낌이 나지 않게 대각선 패턴 + 워터마크를 깔아준다 */
  .zone.all-locked {
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0 10px, transparent 10px 20px),
      radial-gradient(circle at 88% -12%, var(--zone-accent) 0%, transparent 48%),
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: auto, 100% 100%, 22px 22px, 22px 22px;
  }
  .zone.all-locked::after {
    content: '준비 중';
    position: absolute; right: 14px; bottom: 10px;
    font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.18);
  }

  .zone-floor { display: flex; flex-direction: column; gap: 10px; }
  .subteam-label {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: rgba(255,255,255,0.6); margin-bottom: 6px; padding-top: 8px;
    border-top: 1px dashed rgba(255,255,255,0.18);
  }
  .subteam:first-child .subteam-label { border-top: none; padding-top: 0; }
  .subteam-floor { display: flex; flex-wrap: wrap; gap: 14px; align-content: flex-start; }

  .desk-unit {
    width: 76px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer;
    border-radius: 10px;
    padding: 4px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .desk-unit:not(.locked):hover { transform: translateY(-3px); background: rgba(255,255,255,0.06); }
  .desk-unit.locked { cursor: default; filter: grayscale(1); opacity: 0.55; }

  .sprite-wrap { position: relative; }
  .pixel-person {
    width: 34px; height: 51px;
    animation: bob 2.4s ease-in-out infinite;
  }
  .desk-unit.locked .pixel-person { animation: none; }
  .desk-unit.working .sprite-wrap { animation: walk 1.6s ease-in-out infinite; }
  .lock-badge { position: absolute; top: -4px; right: -6px; font-size: 12px; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes walk { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }

  .status-label { font-size: 0.62rem; color: #fff; opacity: 0.85; margin-top: 3px; white-space: nowrap; }

  .nameplate {
    font-size: 0.66rem; font-weight: 700; color: #fff; background: rgba(0,0,0,0.55);
    padding: 2px 7px; border-radius: 999px; white-space: nowrap; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis;
  }

  .desk-prop { width: 30px; height: 8px; background: #6b4a2f; border-radius: 2px; position: relative; margin-top: 2px; }
  .desk-prop .desk-monitor {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 6px; background: #1b1b22; border-radius: 1px;
  }
  .desk-status {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 3px;
  }
  .desk-status.done { background: #33c17c; }
  .desk-status.pending { background: #b8b3c9; }
  .desk-status.locked { background: #7a7a7a; }

  aside.console {
    border-radius: 20px; border: 1px solid var(--border); background: var(--panel-bg);
    padding: 20px 24px; max-height: 720px; overflow-y: auto; backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  aside.console h2 { margin: 0 0 12px; font-size: 1rem; }
  .feed-group { margin-bottom: 8px; }
  .feed-group:last-child { margin-bottom: 0; }
  .feed-group summary {
    cursor: pointer; list-style: none; user-select: none;
    font-size: 0.74rem; font-weight: 800; letter-spacing: 0.05em; color: var(--text-sub);
    text-transform: uppercase; padding: 8px 4px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .feed-group summary::-webkit-details-marker { display: none; }
  .feed-group summary::before { content: '▸'; font-size: 0.7rem; transition: transform 0.15s ease; }
  .feed-group[open] summary::before { transform: rotate(90deg); }
  .feed-group .symbol-card { margin: 16px 0 0; }
  .symbol-card-label { font-size: 0.92rem; font-weight: 800; margin-bottom: 6px; }
  .feed-item { border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; background: var(--bg-bottom); }
  .feed-item .fhead { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; }
  .feed-item .ftext { font-size: 1rem; line-height: 1.7; white-space: pre-wrap; }
  .symbol-empty { color: var(--text-sub); font-size: 0.85rem; padding-bottom: 4px; }

  .summary-card {
    border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px;
    background: var(--bg-bottom); font-size: 1rem; line-height: 1.7; white-space: pre-wrap;
  }

  .empty-note { color: var(--text-sub); font-size: 0.85rem; }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 18px;
    max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 22px;
    color: var(--text-main);
  }
  .modal h3 { margin-top: 0; }
  .modal-body { font-size: 1rem; line-height: 1.7; }
  .modal-body p { margin: 0 0 12px; }
  .modal-body h4 { margin: 16px 0 6px; font-size: 0.92rem; color: var(--text-sub); }
  .modal-body h4:first-child { margin-top: 0; }
  .modal-body ul { margin: 0 0 12px; padding-left: 1.2em; }
  .modal-body li { margin-bottom: 8px; }
  .modal-body li:last-child { margin-bottom: 0; }
  .modal-body strong { color: var(--accent); }
  .modal .close-btn {
    float: right; border: none; background: var(--bg-bottom); border-radius: 999px;
    width: 28px; height: 28px; cursor: pointer; font-size: 0.9rem;
  }
  .watchlist-toggle-btn {
    border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; font-size: 0.85rem; font-weight: 600;
    background: transparent; color: var(--text-main); cursor: pointer;
  }
  .watchlist-panel {
    max-width: 1180px; margin: 0 auto 20px; background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 18px 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    backdrop-filter: blur(6px); box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  .watchlist-panel[hidden] { display: none; }
  @media (max-width: 860px) { .watchlist-panel { grid-template-columns: 1fr; } }
  .watchlist-group-title { font-size: 0.78rem; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; }
  .watchlist-add-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .watchlist-input { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-bottom); color: var(--text-main); font-size: 0.82rem; }
  .watchlist-add-btn { border: none; border-radius: 999px; padding: 6px 12px; font-size: 0.78rem; font-weight: 600; background: var(--accent); color: white; cursor: pointer; }
  .watchlist-add-btn:disabled, .watchlist-input:disabled { opacity: 0.5; cursor: default; }
  .watchlist-error { color: #e0574f; font-size: 0.74rem; min-height: 1em; margin-bottom: 6px; }
  .watchlist-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .watchlist-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg-bottom); border: 1px solid var(--border); border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 0.76rem; }
  .watchlist-chip button { border: none; background: none; cursor: pointer; color: var(--text-sub); font-size: 0.8rem; padding: 0 2px; }
  .watchlist-static-note { grid-column: 1 / -1; color: var(--text-sub); font-size: 0.8rem; }
  .search-suggestions { position: relative; z-index: 5; margin-top: 6px; max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-bg); }
  .search-suggestions[hidden] { display: none; }
  .search-suggestion-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 0.82rem; }
  .search-suggestion-item:hover { background: var(--bg-bottom); }
  .search-suggestion-badge { font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: white; white-space: nowrap; }
  .search-panel { display: grid; gap: 10px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px 20px; margin-bottom: 20px; }
  .search-panel[hidden] { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1 id="office-title">나의 AI 투자 오피스</h1>
      <div class="meta" id="office-meta">불러오는 중...</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="search-toggle-btn" class="watchlist-toggle-btn" type="button">🔍 종목 검색</button>
      <button id="watchlist-toggle-btn" class="watchlist-toggle-btn" type="button">⚙ 관심종목 관리</button>
      <button id="run-now-btn" class="run-now-btn">지금 분석 받기</button>
    </div>
  </header>

  <section class="watchlist-panel" id="watchlist-panel" hidden>
    <div class="watchlist-group" data-type="crypto">
      <div class="watchlist-group-title">크립토 (심볼, 예: SOL)</div>
      <div class="watchlist-add-row">
        <input class="watchlist-input" type="text" placeholder="심볼 (예: SOL)" disabled>
        <button class="watchlist-add-btn" type="button" disabled>추가</button>
      </div>
      <div class="watchlist-error"></div>
      <div class="watchlist-chips"></div>
    </div>
    <div class="watchlist-group" data-type="stocks_kr">
      <div class="watchlist-group-title">국내주식 (6자리 코드, 예: 005930)</div>
      <div class="watchlist-add-row">
        <input class="watchlist-input" type="text" placeholder="코드 (예: 005930)" disabled>
        <button class="watchlist-add-btn" type="button" disabled>추가</button>
      </div>
      <div class="watchlist-error"></div>
      <div class="watchlist-chips"></div>
    </div>
    <div class="watchlist-group" data-type="stocks_us">
      <div class="watchlist-group-title">해외주식 (티커, 예: TSLA)</div>
      <div class="watchlist-add-row">
        <input class="watchlist-input" type="text" placeholder="티커 (예: TSLA)" disabled>
        <button class="watchlist-add-btn" type="button" disabled>추가</button>
      </div>
      <div class="watchlist-error"></div>
      <div class="watchlist-chips"></div>
    </div>
    <div class="watchlist-static-note" id="watchlist-static-note">
      ⚠ 라이브 뷰어(launch_live_office.bat 실행 후 localhost:8787)에서만 사용할 수 있습니다.
    </div>
  </section>

  <section class="search-panel" id="search-panel" hidden>
    <input id="search-input" class="watchlist-input" type="text"
           placeholder="종목/코인 검색 (심볼 또는 이름) — 워치리스트에 없어도 즉시분석" autocomplete="off" disabled>
    <div id="search-suggestions" class="search-suggestions" hidden></div>
    <div id="search-status" class="watchlist-error"></div>
    <div>
      <div class="watchlist-group-title">최근검색</div>
      <div id="recent-searches-chips" class="watchlist-chips"></div>
    </div>
    <div class="watchlist-static-note" id="search-static-note">
      ⚠ 라이브 뷰어(launch_live_office.bat 실행 후 localhost:8787)에서만 사용할 수 있습니다.
    </div>
  </section>

  <div class="layout">
    <main class="office-map" id="office-map"></main>
    <aside class="console">
      <h2>Report</h2>
      <div id="summary"></div>
      <div id="feed"></div>
    </aside>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <button class="close-btn" id="modal-close">✕</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body" class="modal-body"></div>
  </div>

    </svg>`,
    '국내주식': `<svg viewBox="0 0 60 20" class="decor-icon" shape-rendering="crispEdges">
      <polyline points="2,18 14,11 26,14 38,5 50,8" fill="none" stroke="#6fb3e8" stroke-width="2"/>
      <rect x="48" y="0" width="5" height="5" fill="#6fb3e8"/>
    </svg>`,
    '해외주식': `<svg viewBox="0 0 60 20" class="decor-icon" shape-rendering="crispEdges">
      <rect x="2" y="10" width="6" height="8" fill="#4fd0a0"/><rect x="11" y="4" width="6" height="14" fill="#4fd0a0"/>
      <rect x="20" y="8" width="6" height="10" fill="#4fd0a0"/>
      <circle cx="45" cy="10" r="8" fill="none" stroke="#4fd0a0" stroke-width="2"/>
      <line x1="37" y1="10" x2="53" y2="10" stroke="#4fd0a0" stroke-width="1"/>
    </svg>`,
    'PM': `<svg viewBox="0 0 60 20" class="decor-icon" shape-rendering="crispEdges">
      <rect x="1" y="1" width="58" height="18" fill="none" stroke="#f2d43d" stroke-width="1.5"/>
      <rect x="6" y="4" width="4" height="12" fill="#e0574f"/><rect x="12" y="4" width="4" height="12" fill="#4fd07a"/>
      <rect x="18" y="4" width="4" height="12" fill="#6fb3e8"/><rect x="24" y="4" width="4" height="12" fill="#f2a33d"/>
      <rect x="30" y="4" width="4" height="12" fill="#a99bff"/><rect x="36" y="4" width="4" height="12" fill="#4fd0a0"/>
    </svg>`,
    'TRADING': `<svg viewBox="0 0 60 20" class="decor-icon" shape-rendering="crispEdges">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#4fd07a" stroke-width="2"/>
      <line x1="10" y1="10" x2="10" y2="5" stroke="#4fd07a" stroke-width="2"/>
      <line x1="10" y1="10" x2="14" y2="10" stroke="#4fd07a" stroke-width="2"/>
      <rect x="24" y="5" width="34" height="10" fill="#0c1a10" stroke="#4fd07a"/>
      <rect x="27" y="8" width="4" height="4" fill="#4fd07a"/><rect x="34" y="8" width="4" height="4" fill="#e0574f"/>
      <rect x="41" y="8" width="4" height="4" fill="#4fd07a"/><rect x="48" y="8" width="4" height="4" fill="#e0574f"/>
    </svg>`,
    'RISK MGMT': `<svg viewBox="0 0 60 20" class="decor-icon" shape-rendering="crispEdges">
      <rect x="2" y="12" width="6" height="6" fill="#e8564f"/><rect x="11" y="8" width="6" height="10" fill="#e8564f"/>
      <rect x="20" y="4" width="6" height="14" fill="#e8564f"/>
      <path d="M38 17 L45 3 L52 17 Z" fill="none" stroke="#e8564f" stroke-width="2"/>
      <rect x="43.5" y="9" width="3" height="4" fill="#e8564f"/><rect x="43.5" y="14" width="3" height="2" fill="#e8564f"/>
    </svg>`,
  };

  // 8x12 픽셀 그리드로 그린 단순 사람 스프라이트. 셔츠 색은 직원 색상, 머리색은 id로 고정 배정해 다양성을 줌.
  const HAIR_COLORS = ['#2b1d14', '#5b3a29', '#1a1a1a', '#8a5a2b', '#d9c9a3', '#c26b3f'];
  function hairColorFor(id) {
    let sum = 0;
    for (let i = 0; i < id.length; i++) sum += id.charCodeAt(i);
    return HAIR_COLORS[sum % HAIR_COLORS.length];
  }
  function pixelPersonSvg(shirtColor, hairColor) {
    return `
      <svg class="pixel-person" viewBox="0 0 8 12" shape-rendering="crispEdges">
        <rect x="1" y="4" width="6" height="5" fill="${shirtColor}"/>
        <rect x="2" y="9" width="2" height="3" fill="#33384a"/>
        <rect x="4" y="9" width="2" height="3" fill="#33384a"/>
        <rect x="1" y="11" width="6" height="1" fill="#2b2b33"/>
        <rect x="2" y="2" width="4" height="2" fill="#f0c9a0"/>
        <rect x="1" y="0" width="6" height="2" fill="${hairColor}"/>
      </svg>
    `;
  }

  const SUBTEAM_ORDER = ['ANALYSTS', 'RESEARCH'];
  const SUBTEAM_LABELS = { ANALYSTS: '애널리스트', RESEARCH: '리서치' };

  function buildDeskUnit(emp) {
    const unit = document.createElement('div');
    const statusClass = emp.placeholder ? 'locked' : (emp.status === 'done' ? 'done' : 'pending');
    unit.className = 'desk-unit' + (emp.placeholder ? ' locked' : (statusClass === 'pending' ? ' working' : ''));
    const statusLabel = emp.placeholder ? '🔒 대기' : (statusClass === 'done' ? '✅ 완료' : '⏳ 분석 중');
    unit.innerHTML = `
      <div class="sprite-wrap">
        ${pixelPersonSvg(emp.color, hairColorFor(emp.id))}
        ${emp.placeholder ? '<span class="lock-badge">🔒</span>' : ''}
      </div>
      <div class="nameplate"><span class="desk-status ${statusClass}"></span>${emp.name}</div>
      <div class="desk-prop"><div class="desk-monitor"></div></div>
      <div class="status-label">${statusLabel}</div>
    `;
    unit.title = emp.placeholder ? emp.statusText : `${emp.role} · ${emp.statusText}`;
    unit.addEventListener('click', () => openModal(emp));
    return unit;
  }

  // 원문(마크다운 비슷한 텍스트: "- **BTC**: ..." 글머리, "### " 헤더)을 문단/리스트로 나눠서 보여준다.
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function formatAnalysisText(text) {
    const lines = (text || '').split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) return '<p>아직 작성된 분석이 없습니다.</p>';
    let html = '';
    let inList = false;
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
    const render = s => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    lines.forEach(line => {
      const isBullet = /^[-*]\s+/.test(line);
      const isHeading = /^#{1,4}\s+/.test(line);
      const content = line.replace(/^[-*]\s+/, '').replace(/^#{1,4}\s+/, '');
      if (isHeading) {
        closeList();
        html += `<h4>${render(content)}</h4>`;
      } else if (isBullet) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${render(content)}</li>`;
      } else {
        closeList();
        html += `<p>${render(content)}</p>`;
      }
    });
    closeList();
    return html;
  }

  const backdrop = document.getElementById('modal-backdrop');
  const modalTitle = document.getElementById('modal-title');
  const modalBody = document.getElementById('modal-body');
  function openModal(emp) {
    modalTitle.textContent = `${emp.emoji} ${emp.name} — 오늘의 분석`;
    modalBody.innerHTML = formatAnalysisText(emp.fullText);
    backdrop.classList.add('open');
  }
  document.getElementById('modal-close').addEventListener('click', () => backdrop.classList.remove('open'));
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.classList.remove('open'); });

  function renderOffice(data) {
    document.getElementById('office-title').textContent = data.title;
    const activeCount = data.employees.filter(e => !e.placeholder).length;
    document.getElementById('office-meta').textContent =
      `AI STAFF ${activeCount}명(+대기 ${data.employees.length - activeCount}) · 마지막 업데이트 ${data.generatedAt}`;

    const byTeam = {};
    data.employees.forEach(emp => {
      (byTeam[emp.team] = byTeam[emp.team] || []).push(emp);
    });

    mapEl.innerHTML = '';
    TEAM_ORDER.forEach(team => {
      const members = byTeam[team];
      if (!members) return;
      const zone = document.createElement('section');
      zone.className = 'zone' + (members.every(m => m.placeholder) ? ' all-locked' : '');
      zone.dataset.team = team;
      zone.innerHTML = `
        <div class="zone-label">${TEAM_LABELS[team] || team}</div>
        <div class="zone-decor">${TEAM_DECOR[team] || ''}</div>
        <div class="zone-floor"></div>
      `;
      const floor = zone.querySelector('.zone-floor');

      const bySubteam = {};
      members.forEach(emp => {
        const key = emp.subteam || '';
        (bySubteam[key] = bySubteam[key] || []).push(emp);
      });
      const subteamKeys = SUBTEAM_ORDER.filter(k => bySubteam[k]);

      if (subteamKeys.length === 0) {
        // 부서 내 애널리스트/리서치 구분이 없는 존(PM, TRADING, RISK MGMT)은 그냥 한 층에 배치
        members.forEach(emp => floor.appendChild(buildDeskUnit(emp)));
      } else {
        subteamKeys.forEach(key => {
          const sub = document.createElement('div');
          sub.className = 'subteam';
          sub.innerHTML = `<div class="subteam-label">${SUBTEAM_LABELS[key] || key}</div><div class="subteam-floor"></div>`;
          const subFloor = sub.querySelector('.subteam-floor');
          bySubteam[key].forEach(emp => subFloor.appendChild(buildDeskUnit(emp)));
          floor.appendChild(sub);
        });
      }

      mapEl.appendChild(zone);
    });

    summaryEl.innerHTML = data.summary
      ? `<div class="summary-card">${data.summary}</div>`
      : '';

    if (data.watchlistGroups.length === 0) {
      feedEl.innerHTML = '<div class="empty-note">관심종목이 없습니다. 헤더의 "⚙ 관심종목 관리"에서 추가해보세요.</div>';
    } else {
      feedEl.innerHTML = '';
      data.watchlistGroups.forEach(group => {
        const details = document.createElement('details');
        details.className = 'feed-group';
        const summary = document.createElement('summary');
        summary.textContent = `${group.category} (${group.items.length})`;
        details.appendChild(summary);
        group.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'symbol-card';
          const label = document.createElement('div');
          label.className = 'symbol-card-label';
          label.textContent = item.label;
          card.appendChild(label);
          if (item.notes.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'symbol-empty';
            empty.textContent = '아직 분석 없음';
            card.appendChild(empty);
          } else {
            item.notes.forEach(note => {
              const div = document.createElement('div');
              div.className = 'feed-item';
              div.innerHTML = `
                <div class="fhead"><span>${note.emoji} ${note.name}</span></div>
                <div class="ftext">${note.text}</div>
              `;
              card.appendChild(div);
            });
          }
          details.appendChild(card);
        });
        feedEl.appendChild(details);
      });
    }
  }

  renderOffice(window.__OFFICE_DATA__);

  // 로컬 서버(scripts/serve_office.py)로 서빙 중일 때만 /api/live가 응답한다.
  // file://로 직접 열었을 때는 fetch가 실패하므로 조용히 무시하고 스냅샷만 보여준다.
  const runBtn = document.getElementById('run-now-btn');
  const RUN_BTN_DEFAULT = runBtn.textContent;
  let wasRunning = false;

  const LIVE_POLL_MS = 30000;
  function pollLive() {
    fetch('/api/live', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(data => {
        if (!data) return;
        renderOffice(data);
        // 버튼 상태는 실제 분석 프로세스 실행 여부로 결정 (타이머로 눈감고 리셋하지 않음)
        runBtn.disabled = data.analysisRunning;
        if (data.analysisRunning) {
          runBtn.textContent = '분석 중... (완료되면 자동 반영)';
        } else if (data.analysisFailed) {
          runBtn.textContent = '분석 실패 - logs 폴더 확인 (다시 시도하려면 클릭)';
        } else {
          runBtn.textContent = RUN_BTN_DEFAULT;
        }
        // 분석이 막 끝난 시점(실행중 → 완료)이면 종합 리포트를 팝업으로 띄운다 (성공했을 때만)
        if (wasRunning && !data.analysisRunning && !data.analysisFailed) {
          const chief = data.employees.find(e => e.id === 'chief-strategist');
          if (chief) openModal(chief);
        }
        wasRunning = data.analysisRunning;
      })
      .catch(() => {});
  }
  setInterval(pollLive, LIVE_POLL_MS);

  runBtn.addEventListener('click', () => {
    runBtn.disabled = true;
    runBtn.textContent = '요청 보내는 중...';
    fetch('/api/run-now', { method: 'POST' })
      .then(r => r.json().then(data => ({ ok: r.ok, message: data.message })))
      .then(({ ok, message }) => {
        runBtn.textContent = message;
        if (!ok) setTimeout(() => { runBtn.textContent = RUN_BTN_DEFAULT; runBtn.disabled = false; }, 3000);
        else pollLive(); // 즉시 한 번 폴링해서 analysisRunning 상태 반영
      })
      .catch(() => { runBtn.textContent = '실시간 서버에서만 사용 가능합니다'; setTimeout(() => { runBtn.textContent = RUN_BTN_DEFAULT; runBtn.disabled = false; }, 3000); });
  });

  const watchlistToggleBtn = document.getElementById('watchlist-toggle-btn');
  const watchlistPanel = document.getElementById('watchlist-panel');
  const watchlistStaticNote = document.getElementById('watchlist-static-note');
  const WATCHLIST_TYPES = ['crypto', 'stocks_kr', 'stocks_us'];
  const WATCHLIST_ID_FIELD = { crypto: 'symbol', stocks_kr: 'code', stocks_us: 'ticker' };
  let watchlistLoaded = false;

  watchlistToggleBtn.addEventListener('click', () => {
    const willOpen = watchlistPanel.hidden;
    watchlistPanel.hidden = !willOpen;
    if (willOpen && !watchlistLoaded) loadWatchlist();
  });

  function setWatchlistInputsEnabled(enabled) {
    WATCHLIST_TYPES.forEach(type => {
      const group = document.querySelector(`.watchlist-group[data-type="${type}"]`);
      group.querySelector('.watchlist-input').disabled = !enabled;
      group.querySelector('.watchlist-add-btn').disabled = !enabled;
    });
  }

  function renderChips(type, items) {
    const chipsEl = document.querySelector(`.watchlist-group[data-type="${type}"] .watchlist-chips`);
    const idField = WATCHLIST_ID_FIELD[type];
    chipsEl.innerHTML = '';
    items.forEach(item => {
      const chip = document.createElement('span');
      chip.className = 'watchlist-chip';
      chip.innerHTML = `${item.name || item.symbol}<button type="button">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => deleteWatchlistItem(type, item[idField]));
      chipsEl.appendChild(chip);
    });
  }

  function loadWatchlist() {
    fetch('/api/watchlist', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : Promise.reject()))
      .then(data => {
        watchlistLoaded = true;
        watchlistStaticNote.hidden = true;
        setWatchlistInputsEnabled(true);
        WATCHLIST_TYPES.forEach(type => renderChips(type, data[type] || []));
      })
      .catch(() => {
        watchlistStaticNote.hidden = false;
        setWatchlistInputsEnabled(false);
      });
  }

  function addWatchlistItem(type) {
    const group = document.querySelector(`.watchlist-group[data-type="${type}"]`);
    const input = group.querySelector('.watchlist-input');
    const btn = group.querySelector('.watchlist-add-btn');
    const errorEl = group.querySelector('.watchlist-error');
    const symbol = input.value.trim();
    errorEl.textContent = '';
    if (!symbol) return;
    btn.disabled = true;
    fetch('/api/watchlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, symbol }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        btn.disabled = false;
        if (!ok) { errorEl.textContent = data.error || '추가 실패'; return; }
        input.value = '';
        errorEl.textContent = data.warning || '';
        loadWatchlist();
        pollLive();
      })
      .catch(() => { btn.disabled = false; errorEl.textContent = '요청 실패'; });
  }

  function deleteWatchlistItem(type, symbol) {
    fetch('/api/watchlist', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, symbol }),
    })
      .then(() => { loadWatchlist(); pollLive(); })
      .catch(() => {});
  }

  WATCHLIST_TYPES.forEach(type => {
    const group = document.querySelector(`.watchlist-group[data-type="${type}"]`);
    group.querySelector('.watchlist-add-btn').addEventListener('click', () => addWatchlistItem(type));
    group.querySelector('.watchlist-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addWatchlistItem(type);
    });
  });

  const searchToggleBtn = document.getElementById('search-toggle-btn');
  const searchPanel = document.getElementById('search-panel');
  const searchInput = document.getElementById('search-input');
  const searchSuggestions = document.getElementById('search-suggestions');
  const searchStatus = document.getElementById('search-status');
  const searchStaticNote = document.getElementById('search-static-note');
  const recentSearchesChips = document.getElementById('recent-searches-chips');
  const SEARCH_TYPE_LABELS = { crypto: '크립토', stocks_kr: '국내주식', stocks_us: '해외주식' };
  let searchLoaded = false;
  let searchDebounceTimer = null;
  let quickAnalyzePollTimer = null;

  searchToggleBtn.addEventListener('click', () => {
    const willOpen = searchPanel.hidden;
    searchPanel.hidden = !willOpen;
    if (willOpen && !searchLoaded) loadRecentSearches();
  });

  function loadRecentSearches() {
    fetch('/api/recent-searches', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : Promise.reject()))
      .then(data => {
        searchLoaded = true;
        searchStaticNote.hidden = true;
        searchInput.disabled = false;
        renderRecentSearches(data.items || []);
      })
      .catch(() => {
        searchStaticNote.hidden = false;
        searchInput.disabled = true;
      });
  }

  function renderRecentSearches(items) {
    recentSearchesChips.innerHTML = '';
    items.forEach(item => {
      const chip = document.createElement('span');
      chip.className = 'watchlist-chip';
      chip.style.cursor = 'pointer';
      chip.textContent = `${SEARCH_TYPE_LABELS[item.type] || item.type} · ${item.name || item.symbol}`;
      chip.addEventListener('click', () => {
        openModal({ emoji: '🔍', name: `${item.symbol} 즉시분석`, fullText: item.result_text });
      });
      recentSearchesChips.appendChild(chip);
    });
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    const q = searchInput.value.trim();
    if (!q) { searchSuggestions.hidden = true; return; }
    searchDebounceTimer = setTimeout(() => {
      fetch(`/api/symbols?q=${encodeURIComponent(q)}`, { cache: 'no-store' })
        .then(r => (r.ok ? r.json() : { items: [] }))
        .then(data => renderSuggestions(data.items || []))
        .catch(() => { searchSuggestions.hidden = true; });
    }, 250);
  });

  function renderSuggestions(items) {
    searchSuggestions.innerHTML = '';
    if (!items.length) { searchSuggestions.hidden = true; return; }
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'search-suggestion-item';
      row.innerHTML =
        `<span class="search-suggestion-badge">${SEARCH_TYPE_LABELS[item.type] || item.type}</span>` +
        `<span>${item.symbol}</span><span style="color:var(--text-sub);">${item.name}</span>`;
      row.addEventListener('click', () => startQuickAnalyze(item));
      searchSuggestions.appendChild(row);
    });
    searchSuggestions.hidden = false;
  }

  function startQuickAnalyze(item) {
    searchSuggestions.hidden = true;
    searchInput.value = `${item.symbol} 분석 중... (수십초~수분 소요)`;
    searchInput.disabled = true;
    searchStatus.textContent = '';
    fetch('/api/quick-analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: item.type, symbol: item.symbol, name: item.name }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) {
          searchInput.disabled = false;
          searchInput.value = '';
          searchStatus.textContent = data.error || '분석 시작 실패';
          return;
        }
        pollQuickAnalyze();
      })
      .catch(() => {
        searchInput.disabled = false;
        searchInput.value = '';
        searchStatus.textContent = '요청 실패';
      });
  }

  function pollQuickAnalyze() {
    clearTimeout(quickAnalyzePollTimer);
    fetch('/api/quick-analyze/status', { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        if (data.status === 'running') {
          quickAnalyzePollTimer = setTimeout(pollQuickAnalyze, 5000);
          return;
        }
        searchInput.disabled = false;
        searchInput.value = '';
        if (data.status === 'done') {
          openModal({ emoji: '🔍', name: `${data.symbol} 즉시분석`, fullText: data.result_text });
          loadRecentSearches();
        } else if (data.status === 'error') {
          searchStatus.textContent = `분석 실패: ${data.error}`;
        }
      })
      .catch(() => {
        quickAnalyzePollTimer = setTimeout(pollQuickAnalyze, 5000);
      });
  }

  document.addEventListener('click', (e) => {
    if (!searchSuggestions.contains(e.target) && e.target !== searchInput) {
      searchSuggestions.hidden = true;
    }
  });
</script>
</body>
</html>
